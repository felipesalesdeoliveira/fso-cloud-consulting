<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura do frontend estático na AWS</title>
  <desc id="description">Fluxo do usuário pelo Route 53, CloudFront com certificado ACM e bucket S3 privado protegido por OAC.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3 0 6z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1440" height="760" rx="36" fill="url(#background)"/>
  <text x="720" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#0f172a">Frontend com CDN, S3, TLS e domínio customizado</text>
  <text x="720" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#475569">Arquitetura implementada manualmente pelo Console da AWS</text>
  <rect x="555" y="150" width="820" height="500" rx="30" fill="#fff" fill-opacity=".62" stroke="#f59e0b" stroke-width="2"/>
  <text x="590" y="192" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9a3412">AWS Cloud</text>
  <g filter="url(#shadow)" font-family="Arial,sans-serif">
    <rect x="65" y="332" width="190" height="105" rx="22" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <text x="160" y="373" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Usuário</text><text x="160" y="405" text-anchor="middle" font-size="15" fill="#475569">HTTPS</text>
    <rect x="330" y="332" width="190" height="105" rx="22" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="425" y="373" text-anchor="middle" font-size="20" font-weight="700" fill="#5b21b6">Route 53</text><text x="425" y="405" text-anchor="middle" font-size="15" fill="#475569">DNS Alias</text>
    <rect x="650" y="332" width="210" height="105" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="755" y="373" text-anchor="middle" font-size="20" font-weight="700" fill="#1d4ed8">CloudFront</text><text x="755" y="405" text-anchor="middle" font-size="15" fill="#475569">CDN global</text>
    <rect x="1080" y="332" width="210" height="105" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="1185" y="373" text-anchor="middle" font-size="20" font-weight="700" fill="#166534">Amazon S3</text><text x="1185" y="405" text-anchor="middle" font-size="15" fill="#475569">Bucket privado</text>
    <rect x="650" y="220" width="210" height="75" rx="18" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="755" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#be123c">Certificate Manager</text><text x="755" y="276" text-anchor="middle" font-size="14" fill="#475569">Certificado TLS · us-east-1</text>
    <rect x="950" y="500" width="250" height="75" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="1075" y="532" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">Origin Access Control</text><text x="1075" y="557" text-anchor="middle" font-size="14" fill="#475569">Somente o CloudFront acessa o S3</text>
  </g>
  <g fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"><path d="M255 384H330"/><path d="M520 384H650"/><path d="M860 384H1080"/></g>
  <path d="M755 295V332" fill="none" stroke="#e11d48" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1075 500V466H970V405H1080" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/>
  <g font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#2563eb"><text x="282" y="370">domínio</text><text x="557" y="370">Alias</text><text x="925" y="370">OAC</text></g>
  <rect x="125" y="565" width="340" height="68" rx="18" fill="#fff" stroke="#cbd5e1"/>
  <text x="295" y="593" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Deploy manual da SPA React</text><text x="295" y="618" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">build local → upload de site/dist no S3</text>
</svg>
